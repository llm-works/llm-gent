name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # TODO: remove after these packages are released to PyPI
          python -m pip install "git+https://github.com/llm-works/appinfra.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-infer.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-kelt.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-saia.git@develop"
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy llm_gent/ --ignore-missing-imports

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # TODO: remove after these packages are released to PyPI
          python -m pip install "git+https://github.com/llm-works/appinfra.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-infer.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-kelt.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-saia.git@develop"
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  test-summary:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, smoke-wheel]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-wheel.result }}" != "success" ]]; then
            echo "Smoke tests failed"
            exit 1
          fi
          echo "All tests passed"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # TODO: remove after these packages are released to PyPI
          python -m pip install "git+https://github.com/llm-works/appinfra.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-infer.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-kelt.git@develop"
          python -m pip install "git+https://github.com/llm-works/llm-saia.git@develop"
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=llm_gent --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  smoke-wheel:
    name: Smoke (wheel, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel + PyPI dependencies
        run: |
          python -m pip install ./dist/*.whl

      - name: Import smoke check
        run: |
          python -c "import llm_gent; print('llm-gent', llm_gent.__version__)"

      - name: Run quickstart against stub router
        env:
          LLM_GENT_SMOKE: '1'
        run: python examples/quickstart.py
