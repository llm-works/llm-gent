# Alembic configuration for llm-gent framework-level tables.
# Version table is namespaced (alembic_version_llm_gent) so this history
# coexists with any other alembic user (e.g. llm-kelt's
# alembic_version_kelt) in the same Postgres schema.

[alembic]
script_location = %(here)s

# Prepend sys.path with project root (migrations is inside the llm_gent package)
prepend_sys_path = ../..

# Path separator for prepend_sys_path (silences deprecation warning)
path_separator = os

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Truncate long revision identifiers
truncate_slug_length = 40

# Database URL — overridden by env.py from the runtime PG handle
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = DEBUG
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = DEBUG
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
